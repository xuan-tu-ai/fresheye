[project]
name = "fish-app-backend"
version = "0.1.0"
description = "FastAPI backend for the fish freshness web app (thesis Part 5)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "timm==1.0.27",
    "numpy",
    "pillow",
    "scikit-learn",
    "matplotlib",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
