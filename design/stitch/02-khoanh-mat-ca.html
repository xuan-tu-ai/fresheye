<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=390, initial-scale=1.0" name="viewport"/>
<title>FreshEye - Khoanh mắt cá</title>
<!-- BEGIN: Fonts & Tailwind CDN -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- END: Fonts & Tailwind CDN -->
<!-- BEGIN: Custom Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif'],
          },
          colors: {
            aqua: '#d5ede8',
            'aqua-subtle': '#c6e4dd',
            navy: '#102A45',
            coral: '#F37053',
            'coral-hover': '#e25e41',
          }
        }
      }
    };
  </script>
<!-- END: Custom Configuration -->
<!-- BEGIN: Global Styles -->
<style data-purpose="custom-resets">
    /* Lock viewport to standard mobile width */
    body {
      width: 390px;
      margin: 0 auto;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<!-- END: Global Styles -->
</head>
<body class="bg-aqua text-navy font-sans min-h-screen flex flex-col justify-between overflow-x-hidden select-none">
<!-- BEGIN: HeaderSection -->
<!-- Top Bar with close navigation, screen title, and progression badge -->
<header class="w-full px-5 pt-4 pb-3 flex items-center justify-between bg-aqua border-b border-navy/15 z-20" data-purpose="top-navigation">
<!-- Close / Back button -->
<button aria-label="Đóng màn hình" class="w-10 h-10 rounded-full border border-navy/30 bg-transparent flex items-center justify-center text-navy active:scale-95 transition-transform" data-purpose="close-btn">
<svg class="w-5 h-5 stroke-[2] stroke-current" fill="none" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Main editorial title -->
<h1 class="font-serif text-xl font-bold text-navy tracking-tight" data-purpose="screen-title">
      Khoanh mắt cá
    </h1>
<!-- Step / photo index counter -->
<div class="px-3 py-1 rounded-full border border-navy/30 bg-aqua-subtle/50 text-xs font-semibold tracking-wider text-navy" data-purpose="step-counter">
      ẢNH 1/3
    </div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: CropWorkspace -->
<!-- Main interactive crop viewport showing fish image and targeting frame -->
<main class="relative flex-1 bg-[#0c1822] overflow-hidden flex items-center justify-center my-0" data-purpose="crop-viewport">
<!-- Dimmed full preview in background -->
<div class="absolute inset-0 w-full h-full" data-purpose="background-fish-image">
<img alt="Cá nguyên con trên đá lạnh" class="w-full h-full object-cover filter brightness-[0.65] contrast-[1.05]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD053zVvzafZPMKOy5Hb9UI2KBlf7435ObPlh4DqJ6B_lhzQcO7cb3iVXAAVFeciy3sst6eSSnPhske3Zrsw6ymaHGRo1Oh23tCpGRricdrfRulnDSDQxRa8fzYQT0kb_wkLcadpbQDqvjXSl66MHluA08zJ5O6v2XyiA3GajdQIJTSPnww5npKI3IItBRKhJajx-n_8Ap466bj21vhaJMq6py879CG9LjCoXMDWdT-D0ZybCvl1nJp"/>
</div>
<!-- Dark vignette overlay outside active crop area -->
<div class="absolute inset-0 bg-black/45 pointer-events-none" data-purpose="dim-overlay"></div>
<!-- Active 1:1 Crop Frame -->
<div class="relative z-10 w-[240px] h-[240px] pointer-events-auto shadow-2xl" data-purpose="active-crop-box">
<!-- Cutout window highlighting the fish eye -->
<div class="w-full h-full overflow-hidden rounded-sm relative border border-white/40">
<img alt="Vùng mắt cá zoom" class="absolute w-[390px] h-[520px] object-cover max-w-none filter brightness-110 contrast-115 -top-[70px] -left-[75px]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD053zVvzafZPMKOy5Hb9UI2KBlf7435ObPlh4DqJ6B_lhzQcO7cb3iVXAAVFeciy3sst6eSSnPhske3Zrsw6ymaHGRo1Oh23tCpGRricdrfRulnDSDQxRa8fzYQT0kb_wkLcadpbQDqvjXSl66MHluA08zJ5O6v2XyiA3GajdQIJTSPnww5npKI3IItBRKhJajx-n_8Ap466bj21vhaJMq6py879CG9LjCoXMDWdT-D0ZybCvl1nJp"/>
<!-- Composition Grid: Rule of Thirds -->
<div class="absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none" data-purpose="grid-lines">
<div class="border-r border-b border-white/30"></div>
<div class="border-r border-b border-white/30"></div>
<div class="border-b border-white/30"></div>
<div class="border-r border-b border-white/30"></div>
<div class="border-r border-b border-white/30 border-dashed border-coral/60 bg-coral/5"></div>
<div class="border-b border-white/30"></div>
<div class="border-r border-b border-white/30"></div>
<div class="border-r border-b border-white/30"></div>
<div></div>
</div>
<!-- Central Target Reticle -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none" data-purpose="center-reticle">
<div class="w-6 h-6 rounded-full border border-coral/70 flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-coral"></div>
</div>
</div>
</div>
<!-- Accent Crop Corners (Coral) -->
<div class="absolute -top-1.5 -left-1.5 w-6 h-6 border-t-[3.5px] border-l-[3.5px] border-coral rounded-tl-sm pointer-events-none" data-purpose="corner-tl"></div>
<div class="absolute -top-1.5 -right-1.5 w-6 h-6 border-t-[3.5px] border-r-[3.5px] border-coral rounded-tr-sm pointer-events-none" data-purpose="corner-tr"></div>
<div class="absolute -bottom-1.5 -left-1.5 w-6 h-6 border-b-[3.5px] border-l-[3.5px] border-coral rounded-bl-sm pointer-events-none" data-purpose="corner-bl"></div>
<div class="absolute -bottom-1.5 -right-1.5 w-6 h-6 border-b-[3.5px] border-r-[3.5px] border-coral rounded-br-sm pointer-events-none" data-purpose="corner-br"></div>
<!-- Crop ratio indicator tag -->
<div class="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-navy/90 text-white text-[11px] font-medium px-2.5 py-0.5 rounded-full border border-white/20 whitespace-nowrap shadow-md flex items-center gap-1.5" data-purpose="ratio-badge">
<span class="w-1.5 h-1.5 rounded-full bg-coral animate-pulse"></span>
<span>Khung vuông 1:1</span>
</div>
</div>
<!-- Quick action utilities overlay (Rotate/Reset) -->
<aside class="absolute top-4 right-4 flex flex-col gap-2 z-10" data-purpose="viewport-tools">
<button aria-label="Xoay ảnh" class="w-9 h-9 rounded-full bg-black/40 backdrop-blur-md border border-white/20 text-white/90 flex items-center justify-center text-xs active:scale-95 transition-transform" title="Xoay ảnh">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</aside>
</main>
<!-- END: CropWorkspace -->
<!-- BEGIN: ControlFooter -->
<!-- Bottom control panel containing guidance, zoom controls, and navigation buttons -->
<footer class="w-full bg-aqua px-5 pt-4 pb-8 border-t border-navy/15 flex flex-col gap-4 z-20" data-purpose="control-panel">
<!-- User Instruction Hint -->
<div class="flex items-center justify-center gap-2 text-center text-navy/85 text-xs font-medium leading-relaxed px-2" data-purpose="user-hint">
<svg class="w-4 h-4 text-coral shrink-0 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Kéo khung vuông vào mắt cá. Dùng hai ngón tay để phóng to.</span>
</div>
<!-- Zoom Slider Control -->
<div class="w-full bg-aqua-subtle/60 border border-navy/15 rounded-xl px-4 py-2.5 flex items-center gap-3" data-purpose="zoom-slider-container">
<!-- Zoom Out Button -->
<button aria-label="Thu nhỏ" class="w-6 h-6 flex items-center justify-center text-navy/70 hover:text-navy active:scale-90 transition-all">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M20 12H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Zoom Bar Track -->
<div class="relative flex-1 flex items-center" data-purpose="slider-track">
<div class="w-full h-1.5 bg-navy/20 rounded-full overflow-hidden">
<div class="w-[45%] h-full bg-navy rounded-full"></div>
</div>
<!-- Slider Draggable Thumb -->
<div class="absolute left-[45%] -translate-x-1/2 w-4 h-4 bg-coral border-2 border-white rounded-full shadow-sm cursor-grab"></div>
</div>
<!-- Zoom In Button -->
<button aria-label="Phóng to" class="w-6 h-6 flex items-center justify-center text-navy/70 hover:text-navy active:scale-90 transition-all">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Current Zoom Value Display -->
<span class="text-[11px] font-semibold text-navy/80 w-8 text-right font-mono" data-purpose="zoom-label">1.4x</span>
</div>
<!-- Primary Action Buttons -->
<div class="grid grid-cols-2 gap-3 pt-1" data-purpose="action-buttons">
<!-- Retake Action (Secondary outline button) -->
<button class="w-full py-3.5 px-4 rounded-xl border border-navy bg-transparent text-navy font-semibold text-sm flex items-center justify-center gap-2 hover:bg-navy/5 active:scale-[0.98] transition-all" data-purpose="retake-button" type="button">
<svg class="w-4 h-4 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Chụp lại</span>
</button>
<!-- Analyze Action (Primary coral button) -->
<button class="w-full py-3.5 px-4 rounded-xl bg-coral text-white font-bold text-sm shadow-md shadow-coral/25 flex items-center justify-center gap-2 hover:bg-coral-hover active:scale-[0.98] transition-all" data-purpose="analyze-button" type="button">
<span>Phân tích</span>
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M13 7l5 5m0 0l-5 5m5-5H6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</footer>
<!-- END: ControlFooter -->
</body></html>
